name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include tokens, private project files, local game cache files, or full personal paths when a shortened path is enough.

        If this is a security issue, use GitHub's private vulnerability reporting form instead of a public issue:
        https://github.com/mayor-modder/Cities2-MCP/security/advisories/new
  - type: checkboxes
    id: area
    attributes:
      label: Affected area
      options:
        - label: Installation or marketplace plugin
        - label: Knowledge, wiki text, patch notes, or Encyclopedia lookup
        - label: Agent skills or slash commands
        - label: Mod scaffold, build, package, launch, or review workflow
        - label: Documentation
        - label: Other
  - type: dropdown
    id: client
    attributes:
      label: Client
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Codex CLI
        - Codex Desktop
        - Antigravity
        - Other or not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: If you know it, include the installed plugin or package version.
      placeholder: "0.2.0"
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you ask the agent to do, and what happened before the problem appeared?
      placeholder: |
        1. Install the plugin in ...
        2. Ask ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste the smallest useful excerpt. Please redact tokens, private paths, and unrelated project contents.
      render: shell
