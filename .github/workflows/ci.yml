name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install lint tools
        run: python -m pip install ruff

      - name: Run Python lint
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build backend
        run: python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify wheel install
        run: |
          python -m venv /tmp/cities2-mcp-wheel
          /tmp/cities2-mcp-wheel/bin/python -m pip install dist/*.whl
          /tmp/cities2-mcp-wheel/bin/cities2-mcp --version
          /tmp/cities2-mcp-wheel/bin/python tests/smoke_mcp.py --server-command /tmp/cities2-mcp-wheel/bin/cities2-mcp --use-bundled-data
