[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cities2-mcp"
version = "0.1.8"
description = "Local MCP server for Cities: Skylines II game knowledge and modding workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "mayor-modder" }
]
keywords = [
  "cities-skylines-ii",
  "mcp",
  "model-context-protocol",
  "modding"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development"
]

[project.urls]
Homepage = "https://github.com/mayor-modder/Cities2-MCP"
Repository = "https://github.com/mayor-modder/Cities2-MCP"
Issues = "https://github.com/mayor-modder/Cities2-MCP/issues"

[project.scripts]
cities2-mcp = "cities2_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cities2_mcp"]

[tool.hatch.build.targets.wheel.force-include]
skills = "cities2_mcp/skills"

[tool.hatch.build.targets.sdist]
include = [
  "cities2_mcp/**",
  "skills/**",
  "tests/**",
  "scripts/**",
  "integrations/**",
  "server/mcp_server.py",
  "README.md",
  "INSTALL.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "SECURITY.md",
  "server.json",
  "mcp.config.example.json",
  "start_mcp.bat"
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  ".git",
  ".worktrees",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"server/mcp_server.py" = ["E402"]
"tests/test_game_encyclopedia.py" = ["E402"]
